<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glowWeb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#webBg)"/>

  <!-- Concentric Orbital Cyber Rings -->
  <g fill="none" stroke="#4f46e5" opacity="0.3">
    <circle cx="400" cy="250" r="140" stroke-width="1.5" stroke-dasharray="6,8"/>
    <circle cx="400" cy="250" r="210" stroke-width="1" stroke-dasharray="3,6"/>
    <circle cx="400" cy="250" r="280" stroke-width="0.75"/>
  </g>

  <!-- Hypertext Link Rays -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.65" fill="none">
    <line x1="400" y1="250" x2="220" y2="140"/>
    <line x1="400" y1="250" x2="580" y2="140"/>
    <line x1="400" y1="250" x2="220" y2="360"/>
    <line x1="400" y1="250" x2="580" y2="360"/>
  </g>

  <!-- Central CERN Web Core -->
  <g transform="translate(340, 190)" filter="url(#glowWeb)">
    <rect width="120" height="120" rx="20" fill="#0b1120" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="60" y="68" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">WWW</text>
  </g>

  <!-- Hypertext Document Node 1: HTML (1990) -->
  <g transform="translate(140, 80)" filter="url(#glowWeb)">
    <rect width="160" height="100" rx="10" fill="url(#cardGrad)" stroke="#4f46e5" stroke-width="1.8"/>
    <path d="M 15 25 L 145 25" stroke="#334155" stroke-width="1"/>
    <text x="20" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#818cf8" font-weight="bold">&lt;HTML_1990&gt;</text>
    <rect x="20" y="40" width="80" height="6" rx="3" fill="#64748b" opacity="0.6"/>
    <rect x="20" y="55" width="110" height="6" rx="3" fill="#64748b" opacity="0.4"/>
    <rect x="20" y="70" width="60" height="6" rx="3" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Hypertext Document Node 2: HTTP Transfer -->
  <g transform="translate(500, 80)" filter="url(#glowWeb)">
    <rect width="160" height="100" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.8"/>
    <path d="M 15 25 L 145 25" stroke="#334155" stroke-width="1"/>
    <text x="20" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" font-weight="bold">HTTP://PROTOCOL</text>
    <text x="20" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">GET /index.html</text>
    <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">STATUS: 200 OK</text>
  </g>

  <!-- Hypertext Document Node 3: Mosaic Browser (1993) -->
  <g transform="translate(140, 310)" filter="url(#glowWeb)">
    <rect width="160" height="100" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.8"/>
    <path d="M 15 25 L 145 25" stroke="#334155" stroke-width="1"/>
    <text x="20" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fb7185" font-weight="bold">MOSAIC_BROWSER</text>
    <!-- Wireframe browser view -->
    <rect x="20" y="38" width="120" height="48" rx="4" fill="#020617" stroke="#475569" stroke-width="1"/>
    <circle cx="32" cy="50" r="3" fill="#f43f5e"/>
    <rect x="42" y="47" width="85" height="6" rx="2" fill="#334155"/>
  </g>

  <!-- Hypertext Document Node 4: W3C Standards (1994) -->
  <g transform="translate(500, 310)" filter="url(#glowWeb)">
    <rect width="160" height="100" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8"/>
    <path d="M 15 25 L 145 25" stroke="#334155" stroke-width="1"/>
    <text x="20" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" font-weight="bold">W3C_STANDARDS</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">OPEN WEB CONSORTIUM</text>
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#06b6d4">SPEC: CSS1 + JS</text>
  </g>

  <!-- HUD Overlay & Corner Markers -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 30 30 L 70 30 M 30 30 L 30 70"/>
    <path d="M 770 470 L 730 470 M 770 470 L 770 430"/>
  </g>
  <text x="40" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06b6d4">HYPERTEXT_GRAPH // V.1990-2026</text>
</svg>
