<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="gridFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#dotPattern)"/>

  <!-- Perspective 3D Grid Floor (Watch Dogs / Cyber vibe) -->
  <g opacity="0.6">
    <path d="M 0 480 L 450 260 L 750 260 L 1200 480 Z" fill="url(#gridFade)"/>
    <!-- Vertical Perspective Lines -->
    <line x1="600" y1="260" x2="600" y2="480" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    <line x1="550" y1="260" x2="400" y2="480" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="650" y1="260" x2="800" y2="480" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="500" y1="260" x2="200" y2="480" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>
    <line x1="700" y1="260" x2="1000" y2="480" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>
    <line x1="460" y1="260" x2="0" y2="480" stroke="#06b6d4" stroke-width="0.8" opacity="0.2"/>
    <line x1="740" y1="260" x2="1200" y2="480" stroke="#06b6d4" stroke-width="0.8" opacity="0.2"/>

    <!-- Horizontal Floor Grids -->
    <line x1="450" y1="260" x2="750" y2="260" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
    <line x1="400" y1="290" x2="800" y2="290" stroke="#06b6d4" stroke-width="1.2" opacity="0.3"/>
    <line x1="330" y1="330" x2="870" y2="330" stroke="#06b6d4" stroke-width="1.4" opacity="0.35"/>
    <line x1="230" y1="385" x2="970" y2="385" stroke="#06b6d4" stroke-width="1.6" opacity="0.45"/>
    <line x1="100" y1="450" x2="1100" y2="450" stroke="#06b6d4" stroke-width="1.8" opacity="0.5"/>
  </g>

  <!-- Cybernetic Circuit Traces & Nodes -->
  <g stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 80 80 L 220 80 L 280 140 L 420 140"/>
    <path d="M 120 160 L 200 160 L 240 200 L 360 200"/>
    <path d="M 780 120 L 890 120 L 950 60 L 1100 60"/>
    <path d="M 820 190 L 920 190 L 980 250 L 1080 250"/>
  </g>

  <!-- Glowing Nodes with Cyan/Indigo Accent -->
  <g filter="url(#glow)">
    <circle cx="280" cy="140" r="4" fill="#06b6d4"/>
    <circle cx="420" cy="140" r="5" fill="#6366f1"/>
    <circle cx="240" cy="200" r="4" fill="#06b6d4"/>
    <circle cx="950" cy="60" r="4.5" fill="#06b6d4"/>
    <circle cx="980" cy="250" r="5" fill="#f43f5e"/>
    <circle cx="890" cy="120" r="4" fill="#6366f1"/>
  </g>

  <!-- Central Stylish CPU / Microcontroller Emblem -->
  <g transform="translate(540, 100)" filter="url(#glow)">
    <!-- Outer Chip Frame -->
    <rect x="0" y="0" width="120" height="120" rx="16" fill="#090d16" stroke="#4f46e5" stroke-width="2.5"/>
    <rect x="14" y="14" width="92" height="92" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Chip Pins -->
    <g stroke="#06b6d4" stroke-width="2" opacity="0.8">
      <line x1="25" y1="-8" x2="25" y2="0"/>
      <line x1="45" y1="-8" x2="45" y2="0"/>
      <line x1="65" y1="-8" x2="65" y2="0"/>
      <line x1="85" y1="-8" x2="85" y2="0"/>
      <line x1="25" y1="120" x2="25" y2="128"/>
      <line x1="45" y1="120" x2="45" y2="128"/>
      <line x1="65" y1="120" x2="65" y2="128"/>
      <line x1="85" y1="120" x2="85" y2="128"/>
      <line x1="-8" y1="25" x2="0" y2="25"/>
      <line x1="-8" y1="45" x2="0" y2="45"/>
      <line x1="-8" y1="65" x2="0" y2="65"/>
      <line x1="-8" y1="85" x2="0" y2="85"/>
      <line x1="120" y1="25" x2="128" y2="25"/>
      <line x1="120" y1="45" x2="128" y2="45"/>
      <line x1="120" y1="65" x2="128" y2="65"/>
      <line x1="120" y1="85" x2="128" y2="85"/>
    </g>

    <!-- Core Geometric Glyph -->
    <polygon points="60,35 85,60 60,85 35,60" fill="none" stroke="#6366f1" stroke-width="2"/>
    <circle cx="60" cy="60" r="8" fill="#06b6d4"/>
  </g>

  <!-- Watch Dogs Style HUD Telemetry Elements -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#06b6d4" opacity="0.85">
    <!-- Top Left HUD Bracket -->
    <path d="M 40 40 L 90 40 M 40 40 L 40 90" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <text x="50" y="58" letter-spacing="1">ENG.SYS // ARCH_X86_64</text>
    <text x="50" y="74" fill="#64748b" font-size="9">PORT_5000 : [LISTENING]</text>

    <!-- Top Right HUD Bracket -->
    <path d="M 1160 40 L 1110 40 M 1160 40 L 1160 90" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <text x="1010" y="58" letter-spacing="1">STATUS : SECURE</text>
    <text x="1010" y="74" fill="#10b981" font-size="9">● ALL PACKETS VERIFIED</text>

    <!-- Bottom HUD Data -->
    <text x="60" y="440" fill="#475569" font-size="10">KERNEL : PROTOCOL_TCP_IP_ESTABLISHED</text>
    <text x="960" y="440" fill="#475569" font-size="10">NODE_LATENCY : 12ms [OPTIMIZED]</text>
  </g>

  <!-- Minimalist Clean Crosshairs -->
  <g stroke="#f43f5e" stroke-width="1.5" opacity="0.75">
    <line x1="200" y1="280" x2="220" y2="280"/>
    <line x1="210" y1="270" x2="210" y2="290"/>
    <circle cx="210" cy="280" r="14" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3,3"/>

    <line x1="990" y1="310" x2="1010" y2="310"/>
    <line x1="1000" y1="300" x2="1000" y2="320"/>
    <circle cx="1000" cy="310" r="12" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
</svg>
