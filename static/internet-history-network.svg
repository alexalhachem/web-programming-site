<svg id="still" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <filter id="glowNet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="arcGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <style>
    :root { --packet: #a5f3fc; --packet-cycle: 3.5s; }
    .network-links path[stroke-dasharray] { animation: network-flow 4s linear infinite; }
    .network-packets path {
      fill: none; stroke: var(--packet); stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 6 94; animation: packet-travel var(--packet-cycle) linear infinite;
    }
    .network-packets path:nth-child(2) { animation-delay: -1.2s; }
    .network-packets path:nth-child(3) { stroke: #a5b4fc; animation-duration: 4.2s; animation-delay: -2.1s; }
    .network-packets path:nth-child(4) { stroke: #fda4af; animation-delay: -0.6s; }
    .network-packets path:nth-child(5) { animation-duration: 5s; animation-delay: -3s; }
    .network-pulse, .network-orbit { transform-box: fill-box; transform-origin: center; }
    .network-pulse { animation: network-expand 3.2s ease-out infinite; }
    .pulse-routing { animation-delay: -0.8s; }
    .pulse-backbone { animation-delay: -1.6s; }
    .pulse-edge { animation-delay: -2.4s; }
    .network-orbit { animation: network-spin 10s linear infinite; }
    @keyframes network-flow { to { stroke-dashoffset: -130; } }
    @keyframes packet-travel { to { stroke-dashoffset: -100; } }
    @keyframes network-spin { to { transform: rotate(360deg); } }
    @keyframes network-expand {
      0% { transform: scale(0.85); opacity: 0; }
      15% { opacity: 0.85; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .network-packets { display: none; }
    }
    :root:target * { animation: none !important; }
    :root:target .network-packets { display: none; }
  </style>

  <rect width="800" height="500" fill="url(#netBg)"/>

  <!-- Grid Map Constellation -->
  <g opacity="0.15" stroke="#475569" stroke-width="0.75">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Network Topology Arcs -->
  <g class="network-links" fill="none" stroke-linecap="round">
    <path d="M 160 300 Q 280 140 420 220" stroke="url(#arcGrad1)" stroke-width="2.5" opacity="0.8"/>
    <path d="M 420 220 Q 520 120 640 180" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,5" opacity="0.85"/>
    <path d="M 160 300 Q 260 390 440 370" stroke="#6366f1" stroke-width="1.8" opacity="0.6"/>
    <path d="M 440 370 Q 560 360 640 180" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.7"/>
    <path d="M 280 140 Q 450 60 640 180" stroke="#06b6d4" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- Packets move across every route, including the solid connections. -->
  <g class="network-packets">
    <path pathLength="100" d="M 160 300 Q 280 140 420 220"/>
    <path pathLength="100" d="M 420 220 Q 520 120 640 180"/>
    <path pathLength="100" d="M 160 300 Q 260 390 440 370"/>
    <path pathLength="100" d="M 440 370 Q 560 360 640 180"/>
    <path pathLength="100" d="M 280 140 Q 450 60 640 180"/>
  </g>

  <!-- Network Nodes with Pulse Rings -->
  <g filter="url(#glowNet)">
    <!-- Node UCLA (1969) -->
    <circle cx="160" cy="300" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="160" cy="300" r="5" fill="#06b6d4"/>
    <circle class="network-pulse" cx="160" cy="300" r="22" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Node SRI (Stanford) -->
    <circle cx="280" cy="140" r="12" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <circle cx="280" cy="140" r="4.5" fill="#6366f1"/>

    <!-- Central Routing Node TCP/IP -->
    <circle cx="420" cy="220" r="18" fill="#0f172a" stroke="#4f46e5" stroke-width="3"/>
    <circle cx="420" cy="220" r="7" fill="#10b981"/>
    <circle class="network-pulse pulse-routing" cx="420" cy="220" r="28" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.4"/>

    <circle class="network-orbit" cx="420" cy="220" r="34" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="16,12" opacity="0.85"/>

    <!-- Node East Coast / Modern Backbone -->
    <circle cx="640" cy="180" r="16" fill="#0f172a" stroke="#f43f5e" stroke-width="2.5"/>
    <circle cx="640" cy="180" r="6" fill="#f43f5e"/>
    <circle class="network-pulse pulse-backbone" cx="640" cy="180" r="24" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.5"/>

    <!-- Sub-node -->
    <circle cx="440" cy="370" r="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="440" cy="370" r="3.5" fill="#06b6d4"/>
    <circle class="network-pulse pulse-edge" cx="440" cy="370" r="17" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- High-tech Node Labels -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">
    <text x="110" y="340" fill="#06b6d4" font-weight="bold">NODE_01 [UCLA]</text>
    <text x="110" y="355" fill="#64748b" font-size="9">HOST_IMP_1969</text>

    <text x="240" y="115" fill="#818cf8" font-weight="bold">NODE_02 [SRI]</text>
    <text x="240" y="130" fill="#64748b" font-size="9">PACKET_CONFIRMED</text>

    <text x="375" y="185" fill="#34d399" font-weight="bold">GATEWAY_TCP/IP</text>
    <text x="375" y="200" fill="#64748b" font-size="9">RFC_791 PROTOCOL</text>

    <text x="610" y="225" fill="#fb7185" font-weight="bold">NODE_04 [ARPANET]</text>
    <text x="610" y="240" fill="#64748b" font-size="9">56Kbps TRUNK_LINE</text>
  </g>

  <!-- HUD Overlay & Telemetry Brackets -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 30 30 L 70 30 M 30 30 L 30 70"/>
    <path d="M 770 470 L 730 470 M 770 470 L 770 430"/>
  </g>
  <text x="40" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06b6d4">INTERNET_TOPOLOGY // V.1983</text>
</svg>
